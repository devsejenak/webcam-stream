<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Webcam · Login</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0f12;
      --panel: #17191e;
      --line: #2a2d35;
      --text: #e8e9ec;
      --muted: #8b8f99;
      --accent: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
    }

    form {
      width: 100%;
      max-width: 340px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .err {
      display: none;
      margin-top: 12px;
      color: #fca5a5;
      font-size: 13px;
    }

    .err.show {
      display: block;
    }
  </style>
</head>

<body>
  <form method="post" action="/login">
    <h1>Webcam</h1>
    <p>Masukkan token untuk melihat stream.</p>
    <input type="password" name="token" placeholder="Token" autocomplete="current-password" autofocus required>
    <button type="submit">Masuk</button>
    <div class="err">Token salah.</div>
  </form>
</body>

</html>
