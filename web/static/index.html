<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Webcam</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0f12;
      --panel: #17191e;
      --line: #2a2d35;
      --text: #e8e9ec;
      --muted: #8b8f99;
      --live: #ef4444;
      --wait: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .badge[data-state="live"] .dot {
      background: var(--live);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .badge[data-state="wait"] .dot {
      background: var(--wait);
    }

    @keyframes pulse {
      50% {
        opacity: .35;
      }
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--muted);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      color: var(--muted);
      background: rgba(0, 0, 0, .55);
    }

    .overlay[hidden] {
      display: none;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      min-height: 18px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    #boxes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .count {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(239, 68, 68, .9);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
    }

    .count[hidden] {
      display: none;
    }

    button[aria-pressed="true"] {
      border-color: var(--live);
      color: #fca5a5;
    }

    button[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <span class="badge" id="badge" data-state="wait"><span class="dot"></span><span
        id="badge-text">Menghubungkan</span></span>
    <div class="actions">
      <button id="btn-detect" type="button" aria-pressed="true" title="Tampilkan kotak deteksi" hidden>Deteksi</button>
      <button id="btn-live" type="button" title="Lompat ke posisi paling baru">Live</button>
      <form method="post" action="/logout"><button type="submit">Keluar</button></form>
    </div>
  </header>
  <main>
    <div style="width:100%;max-width:1280px">
      <div class="stage">
        <video id="video" muted autoplay playsinline controls></video>
        <canvas id="boxes"></canvas>
        <div class="count" id="count" hidden></div>
        <div class="overlay" id="overlay">Menunggu stream siap…</div>
      </div>
      <div class="meta"><span id="meta"></span><span id="detect-meta"></span></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/static/player.js"></script>
</body>

</html>
